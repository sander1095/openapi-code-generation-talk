<!-- I wanted to get a standalone swagger definition working -->
<!-- https://stackoverflow.com/a/73993872/3013479 -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="swagger.css">

  <title>Conference API</title>
</head>

<body>

  <div id="your-app-docs"></div>

  <script src="swagger.js"></script>
  <!-- Defines window.conferenceOpenApi, so this page also works when opened straight from disk -->
  <script src="../conference_openapi.js"></script>
  <script>

    window.onload = function () {

      const ui = SwaggerUIBundle({
        spec: window.conferenceOpenApi,
        dom_id: "#your-app-docs",
        deepLinking: true,
      })

    }

  </script>

</body>

</html>
